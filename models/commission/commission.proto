syntax = "proto3";

package commission;

option go_package = "github.com/sologenic/com-fs-utils-lib/models/commission;commission";

import "sologenic/com-fs-utils-lib/models/decimal/decimal.proto";
import "buf/validate/validate.proto";

// Broker API specific commission fields for user level (overrrides organization level)
message CommissionSettings {
  decimal.Decimal Commission = 25 [
    (buf.validate.field).required = true
  ];
  CommissionType CommissionType = 26 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  // NOTIONAL: flat per-order fee in currency units (e.g. "2.50").
  option (buf.validate.message).cel = {
    id: "commission_settings.notional.range"
    message: "NOTIONAL commission must be between 0 and 10000 with at most 2 fraction digits"
    expression:
      "!has(this.Commission) || this.CommissionType != 1 || ("
      "this.Commission.Value >= 0 && this.Commission.Exp >= -2 && ("
      "this.Commission.Value == 0 || "
      "(this.Commission.Exp == -2 && this.Commission.Value <= 1000000) || "
      "(this.Commission.Exp == -1 && this.Commission.Value <= 100000) || "
      "(this.Commission.Exp == 0 && this.Commission.Value <= 10000) || "
      "(this.Commission.Exp == 1 && this.Commission.Value <= 1000) || "
      "(this.Commission.Exp == 2 && this.Commission.Value <= 100) || "
      "(this.Commission.Exp == 3 && this.Commission.Value <= 10) || "
      "(this.Commission.Exp == 4 && this.Commission.Value <= 1)"
      "))"
  };

  // QTY: per-quantity/contract fee (e.g. "0.05" * qty).
  option (buf.validate.message).cel = {
    id: "commission_settings.qty.range"
    message: "QTY commission must be between 0 and 100 with at most 2 fraction digits"
    expression:
      "!has(this.Commission) || this.CommissionType != 2 || ("
      "this.Commission.Value >= 0 && this.Commission.Exp >= -2 && ("
      "this.Commission.Value == 0 || "
      "(this.Commission.Exp == -2 && this.Commission.Value <= 10000) || " // 100.00
      "(this.Commission.Exp == -1 && this.Commission.Value <= 1000) || "  // 100.0
      "(this.Commission.Exp == 0 && this.Commission.Value <= 100) || "    // 100
      "(this.Commission.Exp == 1 && this.Commission.Value <= 10) || "     // 10e1
      "(this.Commission.Exp == 2 && this.Commission.Value <= 1)"          // 1e2
      "))"
  };

  // BPS: basis points of order notional (e.g. "12.50" bps); max two decimal places.
  option (buf.validate.message).cel = {
    id: "commission_settings.bps.range"
    message: "BPS commission must be between 0 and 10000 with at most 2 fraction digits"
    expression:
      "!has(this.Commission) || this.CommissionType != 3 || ("
      "this.Commission.Value >= 0 && this.Commission.Exp >= -2 && ("
      "this.Commission.Value == 0 || "
      "(this.Commission.Exp == -2 && this.Commission.Value <= 1000000) || "
      "(this.Commission.Exp == -1 && this.Commission.Value <= 100000) || "
      "(this.Commission.Exp == 0 && this.Commission.Value <= 10000) || "
      "(this.Commission.Exp == 1 && this.Commission.Value <= 1000) || "
      "(this.Commission.Exp == 2 && this.Commission.Value <= 100) || "
      "(this.Commission.Exp == 3 && this.Commission.Value <= 10) || "
      "(this.Commission.Exp == 4 && this.Commission.Value <= 1)"
      "))"
  };
}

/**
 * CommissionType defines the specific method used to interpret and calculate
 * the commission charged to the end user for a given order.
 *
 * SUBMISSION GUIDELINES:
 * When submitting an order, the actual commission value must be provided alongside
 * this enum as a string representing a numeric value (e.g., "1.50") to prevent
 * floating-point precision loss.
 *
 */
enum CommissionType {
    NOT_USED_COMMISSION_TYPE = 0;

    // Charge commission on a fixed per-order basis.
    // The submitted string value is applied as a flat fee for the entire order,
    // regardless of the quantity of shares or contracts executed.
    //
    // Example Submission:
    // - Submitted Value: "2.50"
    // - Result: A flat $2.50 commission is collected for the order.
    NOTIONAL = 1;

    // Charge commission on a per-quantity or per-contract basis, pro-rated.
    // The total commission is calculated by multiplying the executed order quantity
    // by the submitted string value.
    //
    // Example Submission:
    // - Submitted Value: "0.05"
    // - Order Quantity: 100 shares
    // - Result: $5.00 total commission (100 * 0.05).
    QTY = 2;

    // Charge commission in basis points (BPS).
    // The commission is calculated as a percentage of the total notional value
    // of the order. 1 basis point equals 0.01% (or 0.0001).
    // The system automatically converts the order to a notional amount to
    // calculate the final fee. The submitted BPS value can have up to two decimal places.
    //
    // Example Submission:
    // - Submitted Value: "12.50" (representing 12.50 bps or 0.125%)
    // - Order Notional Value: $10,000
    // - Result: $12.50 total commission ($10,000 * 0.125%).
    BPS = 3;
}
